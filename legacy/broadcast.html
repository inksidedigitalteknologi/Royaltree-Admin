<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-send"></i> Broadcast Notification</div></div>
                    <div class="form-group"><label class="form-label">Title</label><input type="text" class="form-input" id="bc_title" placeholder="Judul notifikasi"></div>
                    <div class="form-group"><label class="form-label">Message</label><textarea class="form-input" id="bc_message" rows="4" placeholder="Isi notifikasi"></textarea></div>
                    <button class="btn btn-primary" onclick="sendBroadcast()"><i class="bi bi-send"></i> Kirim ke Semua User</button>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Broadcast');
        window.sendBroadcast = async () => {
            const title = document.getElementById("bc_title").value.trim();
            const message = document.getElementById("bc_message").value.trim();
            if (!title || !message) { showToast("Title & message wajib", "warning"); return; }
            if (!confirm("Kirim broadcast ke semua user?")) return;
            try {
                const res = await AdminAPI.request("/notifications/broadcast", { method: "POST", body: { title, message } });
                if (res.success) { showToast("Broadcast terkirim", "success"); document.getElementById("bc_title").value = ""; document.getElementById("bc_message").value = ""; }
                else showToast(res.message || "Gagal", "error");
            } catch (e) { showToast(e.message, "error"); }
        };
    </script>
</body>
</html>
