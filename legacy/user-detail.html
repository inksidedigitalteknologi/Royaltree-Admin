<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Detail — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card mb-4">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-person-badge"></i> User Detail</div>
                        <a href="users.html" class="btn btn-sm btn-outline"><i class="bi bi-arrow-left"></i> Back</a>
                    </div>
                    <div id="userDetailContent"><div class="empty-state"><div class="empty-state-icon"><i class="bi bi-person"></i></div><div class="empty-state-title">Loading user...</div></div></div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('User Detail');
        const params = new URLSearchParams(location.search);
        const uid = params.get("uid");
        if (!uid) {
            document.getElementById("userDetailContent").innerHTML = "<div class=\"text-danger\">UID tidak ditemukan</div>";
        } else {
            (async () => {
                try {
                    const res = await AdminAPI.request("/users/" + uid);
                    if (!res.success) throw new Error(res.message || "Gagal");
                    const d = (res.data && res.data.user) || res.data || {};
                    document.getElementById("userDetailContent").innerHTML = `
                        <div class="d-grid gap-3" style="grid-template-columns: 1fr 1fr;">
                            <div><label class="form-label">Name</label><div>${escapeHtml(d.name || "-")}</div></div>
                            <div><label class="form-label">Email</label><div>${escapeHtml(d.email || "-")}</div></div>
                            <div><label class="form-label">Phone</label><div>${escapeHtml(d.phone || "-")}</div></div>
                            <div><label class="form-label">Tier</label><div><span class="badge badge-accent">${escapeHtml(d.tier || "FREE")}</span></div></div>
                            <div><label class="form-label">Balance (Rp)</label><div><strong class="text-gold">Rp ${(d.balance || 0).toLocaleString('id-ID')}</strong></div></div>
                            <div><label class="form-label">Referral Code</label><div><code>${escapeHtml(d.referralCode || "-")}</code></div></div>
                            <div><label class="form-label">Referred Count</label><div>${d.referredCount || 0}</div></div>
                            <div><label class="form-label">City</label><div>${escapeHtml(d.city || "-")}</div></div>
                        </div>
                    `;
                } catch (e) {
                    document.getElementById("userDetailContent").innerHTML = "<div class=\"text-danger\">" + e.message + "</div>";
                }
            })();
        }
    </script>
</body>
</html>
