<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaigns — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-megaphone"></i> Campaigns</div></div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead><tr><th>ID</th><th>Title</th><th>Budget</th><th>Status</th></tr></thead>
                            <tbody id="campaignsBody"><tr><td colspan="4" class="text-center text-muted" style="padding:40px;">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Campaigns');
        (async () => {
            try {
                const res = await AdminAPI.request("/campaigns");
                const list = res.data || [];
                const body = document.getElementById("campaignsBody");
                if (list.length === 0) { body.innerHTML = "<tr><td colspan=\"4\" class=\"text-center text-muted\" style=\"padding:40px;\">No campaigns</td></tr>"; return; }
                body.innerHTML = list.map(c => `<tr><td><code>${escapeHtml(c.id || "-")}</code></td><td>${escapeHtml(c.title || c.name || "-")}</td><td>${(c.budget || 0).toLocaleString()}</td><td><span class="badge badge-${c.status === "ACTIVE" ? "success" : "muted"}">${escapeHtml(c.status || "-")}</span></td></tr>`).join("");
            } catch (e) { document.getElementById("campaignsBody").innerHTML = `<tr><td colspan="4" class="text-center text-danger">${e.message}</td></tr>`; }
        })();
    </script>
</body>
</html>
