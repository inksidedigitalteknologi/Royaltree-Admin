<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-thermometer-half"></i> Thermal Stats</div></div>
                    <div id="thermalContent"><div class="empty-state"><div class="empty-state-icon"><i class="bi bi-thermometer"></i></div><div class="empty-state-title">Loading...</div></div></div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Thermal');
        (async () => {
            try {
                const res = await AdminAPI.request("/thermal-stats");
                if (res.success && res.data) {
                    document.getElementById("thermalContent").innerHTML = "<pre style=\"color:var(--text-secondary);font-size:12px;\">" + JSON.stringify(res.data, null, 2) + "</pre>";
                }
            } catch (e) { document.getElementById("thermalContent").innerHTML = `<div class="text-danger">${e.message}</div>`; }
        })();
    </script>
</body>
</html>
