<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-graph-up-arrow"></i> Analytics</div></div>
                    <div class="stat-grid">
                        <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-people-fill"></i></div><div class="stat-value" id="a-users">-</div><div class="stat-label">Users</div></div>
                        <div class="stat-card"><div class="stat-icon green"><i class="bi bi-coin"></i></div><div class="stat-value" id="a-rtp">-</div><div class="stat-label">Total RTP</div></div>
                        <div class="stat-card"><div class="stat-icon amber"><i class="bi bi-cash-stack"></i></div><div class="stat-value" id="a-pending">-</div><div class="stat-label">Pending WD</div></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Analytics');
        (async () => {
            try {
                const res = await AdminAPI.request("/stats");
                if (res.success && res.data) {
                    const d = res.data;
                    document.getElementById("a-users").textContent = (d.totalUsers || 0).toLocaleString();
                    document.getElementById("a-rtp").textContent = (d.totalRTP || 0).toLocaleString();
                    document.getElementById("a-pending").textContent = (d.pendingWithdrawals || 0).toLocaleString();
                }
            } catch (e) { showToast(e.message, "error"); }
        })();
    </script>
</body>
</html>
