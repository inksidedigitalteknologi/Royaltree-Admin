<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firestore Usage — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
    <style>
        .usage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .usage-stat { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .usage-stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
        .usage-stat-value { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
        .usage-stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .quota-bar { height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .quota-fill { height: 100%; background: var(--success); transition: width 0.3s; }
        .quota-fill.warn { background: var(--warning); }
        .quota-fill.danger { background: var(--danger); }
        .trend-chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding: 12px 0; }
        .trend-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .trend-bar { width: 100%; background: linear-gradient(180deg, var(--accent), var(--info)); border-radius: 4px 4px 0 0; min-height: 2px; transition: opacity 0.2s; position: relative; }
        .trend-bar:hover { opacity: 0.8; }
        .trend-label { font-size: 9px; color: var(--text-muted); white-space: nowrap; }
        .ep-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .ep-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .ep-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .ep-table tr:hover td { background: var(--bg-tertiary); }
        .ep-name { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-primary); }
        .badge-soft { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .badge-read { background: rgba(59,130,246,0.15); color: #60A5FA; }
        .badge-write { background: rgba(16,185,129,0.15); color: #34D399; }
        .badge-delete { background: rgba(239,68,68,0.15); color: #F87171; }
        .warning-banner { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #FBBF24; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }
        .empty { text-align: center; padding: 40px; color: var(--text-muted); }
        .filter-input { width: 100%; max-width: 320px; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 13px; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <!-- Header row -->
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <div>
                        <h2 style="margin:0; font-size:22px; font-weight:800;">Firestore Usage</h2>
                        <div style="font-size:13px; color:var(--text-muted); margin-top:4px;" id="lastUpdated">Memuat...</div>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <select class="form-input" id="periodSelect" style="width:auto;" onchange="loadUsage()">
                            <option value="7">7 hari</option>
                            <option value="14">14 hari</option>
                            <option value="30">30 hari</option>
                        </select>
                        <button class="btn btn-primary" onclick="loadUsage()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                    </div>
                </div>

                <div id="warningBanner"></div>

                <!-- Stat cards -->
                <div class="usage-grid mb-3">
                    <div class="usage-stat">
                        <div class="usage-stat-icon" style="background:rgba(59,130,246,0.15); color:#60A5FA;">👁️</div>
                        <div class="usage-stat-value" id="statReads">-</div>
                        <div class="usage-stat-label">Reads</div>
                        <div class="quota-bar"><div class="quota-fill" id="quotaReads" style="width:0%"></div></div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;" id="quotaReadsText">- / -</div>
                    </div>
                    <div class="usage-stat">
                        <div class="usage-stat-icon" style="background:rgba(16,185,129,0.15); color:#34D399;">✏️</div>
                        <div class="usage-stat-value" id="statWrites">-</div>
                        <div class="usage-stat-label">Writes</div>
                        <div class="quota-bar"><div class="quota-fill" id="quotaWrites" style="width:0%"></div></div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;" id="quotaWritesText">- / -</div>
                    </div>
                    <div class="usage-stat">
                        <div class="usage-stat-icon" style="background:rgba(239,68,68,0.15); color:#F87171;">🗑️</div>
                        <div class="usage-stat-value" id="statDeletes">-</div>
                        <div class="usage-stat-label">Deletes</div>
                        <div class="quota-bar"><div class="quota-fill" id="quotaDeletes" style="width:0%"></div></div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;" id="quotaDeletesText">- / -</div>
                    </div>
                    <div class="usage-stat">
                        <div class="usage-stat-icon" style="background:rgba(245,158,11,0.15); color:#FBBF24;">💰</div>
                        <div class="usage-stat-value" id="statCost">-</div>
                        <div class="usage-stat-label">Estimasi Biaya</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;" id="statCostIdr">-</div>
                    </div>
                    <div class="usage-stat">
                        <div class="usage-stat-icon" style="background:rgba(139,92,246,0.15); color:#A78BFA;">📊</div>
                        <div class="usage-stat-value" id="statTotal">-</div>
                        <div class="usage-stat-label">Total Operasi</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">reads + writes + deletes</div>
                    </div>
                </div>

                <!-- Trend chart -->
                <div class="card mb-3">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-graph-up"></i> Trend Harian</div>
                    </div>
                    <div class="trend-chart" id="trendChart"><div class="empty">Memuat...</div></div>
                </div>

                <!-- Top endpoints -->
                <div class="card mb-3">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-fire"></i> Top Endpoints (Total)</div>
                        <input type="text" class="filter-input" id="epFilter" placeholder="Cari endpoint..." oninput="renderEndpoints()">
                    </div>
                    <div id="epTable"><div class="empty">Memuat...</div></div>
                </div>

                <!-- Per-day breakdown -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-calendar3"></i> Breakdown Harian</div>
                    </div>
                    <div id="dayTable"><div class="empty">Memuat...</div></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Firestore Usage');

        let currentData = null;
        let allEndpoints = [];

        function fmt(n) {
            if (n === null || n === undefined) return '-';
            return Number(n).toLocaleString('id-ID');
        }
        function fmtUsd(n) {
            if (n === null || n === undefined) return '-';
            return '$' + Number(n).toFixed(4);
        }
        function fmtIdr(n) {
            if (n === null || n === undefined) return '-';
            return 'Rp ' + Number(n).toLocaleString('id-ID');
        }
        function fmtShort(n) {
            if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n/1e3).toFixed(1) + 'k';
            return String(n);
        }
        function pct(a, b) {
            if (!b) return 0;
            return Math.min(100, (a / b) * 100);
        }
        function quotaClass(p) {
            if (p >= 90) return 'danger';
            if (p >= 70) return 'warn';
            return '';
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function loadUsage() {
            const days = document.getElementById('periodSelect').value;
            document.getElementById('lastUpdated').textContent = 'Memuat...';
            try {
                const res = await AdminAPI.request('/firestore-usage?days=' + days);
                if (!res.success) {
                    showToast('Gagal: ' + (res.message || 'Unknown'), 'error');
                    return;
                }
                currentData = res;
                allEndpoints = res.topEndpoints || [];
                renderStats(res);
                renderTrend(res);
                renderEndpoints();
                renderDayTable(res);
                document.getElementById('lastUpdated').textContent =
                    'Diperbarui: ' + new Date().toLocaleString('id-ID') + ' · ' + res.days + ' hari';
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                document.getElementById('lastUpdated').textContent = 'Gagal memuat';
            }
        }

        function renderStats(res) {
            const t = res.totals || { reads: 0, writes: 0, deletes: 0 };
            const ft = res.freeTier || { reads: 1, writes: 1, deletes: 1 };
            const c = res.cost || {};
            const lb = res.liveBuffer || { reads: 0, writes: 0, deletes: 0 };

            document.getElementById('statReads').textContent = fmt(t.reads);
            document.getElementById('statWrites').textContent = fmt(t.writes);
            document.getElementById('statDeletes').textContent = fmt(t.deletes);
            document.getElementById('statCost').textContent = fmtUsd(c.total || 0);
            document.getElementById('statCostIdr').textContent = fmtIdr(c.idr || 0) + ' · rate ' + fmt(c.exchange_rate || 0);
            document.getElementById('statTotal').textContent = fmt((t.reads||0)+(t.writes||0)+(t.deletes||0));

            // Quota (pakai free tier harian × days → dibanding total)
            const dailyFreeReads = ft.reads / 30;   // free tier per bulan
            const dailyFreeWrites = ft.writes / 30;
            const dailyFreeDeletes = ft.deletes / 30;
            const dayCount = res.days || 7;
            const totalFreeReads = dailyFreeReads * dayCount;
            const totalFreeWrites = dailyFreeWrites * dayCount;
            const totalFreeDeletes = dailyFreeDeletes * dayCount;

            const pR = pct(t.reads, totalFreeReads);
            const pW = pct(t.writes, totalFreeWrites);
            const pD = pct(t.deletes, totalFreeDeletes);

            document.getElementById('quotaReads').style.width = pR + '%';
            document.getElementById('quotaReads').className = 'quota-fill ' + quotaClass(pR);
            document.getElementById('quotaReadsText').textContent =
                fmt(t.reads) + ' / ' + fmt(totalFreeReads) + ' (' + pR.toFixed(1) + '%)';

            document.getElementById('quotaWrites').style.width = pW + '%';
            document.getElementById('quotaWrites').className = 'quota-fill ' + quotaClass(pW);
            document.getElementById('quotaWritesText').textContent =
                fmt(t.writes) + ' / ' + fmt(totalFreeWrites) + ' (' + pW.toFixed(1) + '%)';

            document.getElementById('quotaDeletes').style.width = pD + '%';
            document.getElementById('quotaDeletes').className = 'quota-fill ' + quotaClass(pD);
            document.getElementById('quotaDeletesText').textContent =
                fmt(t.deletes) + ' / ' + fmt(totalFreeDeletes) + ' (' + pD.toFixed(1) + '%)';

            // Warning banner
            const wb = document.getElementById('warningBanner');
            const maxP = Math.max(pR, pW, pD);
            if (maxP >= 90) {
                wb.innerHTML = '<div class="warning-banner"><i class="bi bi-exclamation-triangle-fill"></i> <strong>Kuota hampir habis!</strong> Penggunaan ' + maxP.toFixed(1) + '% dari free tier periode ini. Pertimbangkan upgrade atau optimasi query.</div>';
            } else if (maxP >= 70) {
                wb.innerHTML = '<div class="warning-banner"><i class="bi bi-exclamation-circle-fill"></i> Penggunaan ' + maxP.toFixed(1) + '% dari free tier. Pantau terus.</div>';
            } else {
                wb.innerHTML = '';
            }
        }

        function renderTrend(res) {
            const el = document.getElementById('trendChart');
            const data = res.data || [];
            if (data.length === 0) { el.innerHTML = '<div class="empty">Belum ada data</div>'; return; }

            const maxTotal = Math.max(...data.map(d => (d.reads||0) + (d.writes||0) + (d.deletes||0)), 1);
            el.innerHTML = data.map(d => {
                const total = (d.reads||0) + (d.writes||0) + (d.deletes||0);
                const h = Math.max(2, (total / maxTotal) * 100);
                const dateShort = d.date ? d.date.slice(5) : '';
                return '<div class="trend-bar-wrap" title="' + d.date + ' — ' + fmt(total) + ' ops">' +
                    '<div class="trend-bar" style="height:' + h + '%"></div>' +
                    '<div class="trend-label">' + dateShort + '</div>' +
                    '</div>';
            }).join('');
        }

        function renderEndpoints() {
            const el = document.getElementById('epTable');
            const q = (document.getElementById('epFilter').value || '').toLowerCase();
            const list = allEndpoints.filter(e => !q || (e.endpoint || '').toLowerCase().includes(q));
            if (list.length === 0) { el.innerHTML = '<div class="empty">Tidak ada endpoint cocok</div>'; return; }

            el.innerHTML = '<table class="ep-table"><thead><tr>' +
                '<th>#</th><th>Endpoint</th><th style="text-align:right">Reads</th><th style="text-align:right">Writes</th><th style="text-align:right">Deletes</th><th style="text-align:right">Total</th>' +
                '</tr></thead><tbody>' +
                list.map((e, i) =>
                    '<tr><td style="color:var(--text-muted)">' + (i+1) + '</td>' +
                    '<td><span class="ep-name">' + escapeHtml(e.endpoint || '') + '</span></td>' +
                    '<td style="text-align:right"><span class="badge-soft badge-read">' + fmt(e.reads||0) + '</span></td>' +
                    '<td style="text-align:right"><span class="badge-soft badge-write">' + fmt(e.writes||0) + '</span></td>' +
                    '<td style="text-align:right"><span class="badge-soft badge-delete">' + fmt(e.deletes||0) + '</span></td>' +
                    '<td style="text-align:right; font-weight:700;">' + fmt(e.total||0) + '</td></tr>'
                ).join('') +
                '</tbody></table>';
        }

        function renderDayTable(res) {
            const el = document.getElementById('dayTable');
            const data = res.data || [];
            if (data.length === 0) { el.innerHTML = '<div class="empty">Belum ada data</div>'; return; }
            el.innerHTML = '<table class="ep-table"><thead><tr>' +
                '<th>Tanggal</th><th style="text-align:right">Reads</th><th style="text-align:right">Writes</th><th style="text-align:right">Deletes</th><th style="text-align:right">Total</th><th style="text-align:right">Endpoint Unik</th>' +
                '</tr></thead><tbody>' +
                data.slice().reverse().map(d => {
                    const total = (d.reads||0)+(d.writes||0)+(d.deletes||0);
                    const uniq = d.endpoints ? Object.keys(d.endpoints).length : 0;
                    return '<tr><td>' + escapeHtml(d.date || '') + '</td>' +
                        '<td style="text-align:right"><span class="badge-soft badge-read">' + fmt(d.reads||0) + '</span></td>' +
                        '<td style="text-align:right"><span class="badge-soft badge-write">' + fmt(d.writes||0) + '</span></td>' +
                        '<td style="text-align:right"><span class="badge-soft badge-delete">' + fmt(d.deletes||0) + '</span></td>' +
                        '<td style="text-align:right; font-weight:700;">' + fmt(total) + '</td>' +
                        '<td style="text-align:right; color:var(--text-muted)">' + uniq + '</td></tr>';
                }).join('') +
                '</tbody></table>';
        }

        loadUsage();
    </script>
</body>
</html>
