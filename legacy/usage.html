<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firestore Usage — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-database-check"></i> Firestore Usage</div></div>
                    <div class="stat-grid">
                        <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-eye"></i></div><div class="stat-value" id="u-reads">-</div><div class="stat-label">Reads</div></div>
                        <div class="stat-card"><div class="stat-icon green"><i class="bi bi-pencil"></i></div><div class="stat-value" id="u-writes">-</div><div class="stat-label">Writes</div></div>
                        <div class="stat-card"><div class="stat-icon red"><i class="bi bi-trash"></i></div><div class="stat-value" id="u-deletes">-</div><div class="stat-label">Deletes</div></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Firestore Usage');
        (async () => {
            try {
                const res = await AdminAPI.request("/firestore-usage");
                if (res.success && res.data) {
                    const d = res.data;
                    document.getElementById("u-reads").textContent = (d.reads || 0).toLocaleString();
                    document.getElementById("u-writes").textContent = (d.writes || 0).toLocaleString();
                    document.getElementById("u-deletes").textContent = (d.deletes || 0).toLocaleString();
                }
            } catch (e) { showToast(e.message, "error"); }
        })();
    </script>
</body>
</html>
