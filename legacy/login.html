<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { max-width: 420px; width: 100%; }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo-icon { font-size: 64px; margin-bottom: 12px; }
        .login-logo-title { font-size: 28px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .login-logo-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo">
            <div class="login-logo-icon">🌳</div>
            <div class="login-logo-title">Royaltree Admin</div>
            <div class="login-logo-sub">Login untuk akses dashboard</div>
        </div>
        <div class="card">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="password" placeholder="Masukkan password" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">API Key</label>
                    <input type="password" class="form-input" id="apiKey" placeholder="Masukkan API key" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
                <div id="error" class="text-danger mt-3" style="font-size: 13px;"></div>
            </form>
        </div>
        <div class="text-center mt-4" style="font-size: 11px; color: var(--text-muted);">
            © 2026 Royaltree — Inkside Digital
        </div>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const apiKey = document.getElementById('apiKey').value;
            const errorEl = document.getElementById('error');
            const btn = document.getElementById('loginBtn');
            errorEl.textContent = '';
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Loading...';

            try {
                const res = await AdminAPI.login(password, apiKey);
                console.log('[LOGIN] Response:', res);

                if (res && res.success) {
                    // ✅ SIMPAN TOKEN MANUAL
                    if (res.token) {
                        localStorage.setItem('royaltree_admin_token', res.token);
                    } else {
                        // Fallback: pakai apiKey sebagai token (kalau backend return apiKey)
                        console.warn('[LOGIN] No token in response — fallback');
                    }
                    // Save admin name kalau ada
                    if (res.name) {
                        localStorage.setItem('royaltree_admin_name', res.name);
                    }

                    // Verifikasi token tersimpan
                    const savedToken = localStorage.getItem('royaltree_admin_token');
                    console.log('[LOGIN] Saved token:', savedToken ? savedToken.substring(0, 20) + '...' : 'NONE');

                    if (!savedToken) {
                        errorEl.textContent = 'Token tidak tersimpan. Cek response backend.';
                        btn.disabled = false;
                        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Login';
                        return;
                    }

                    // Redirect
                    window.location.replace('index.html');
                } else {
                    errorEl.textContent = (res && res.message) || 'Login gagal';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Login';
                }
            } catch (err) {
                console.error('[LOGIN] Error:', err);
                errorEl.textContent = err.message || 'Network error';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Login';
            }
        });
    </script>
</body>
</html>
