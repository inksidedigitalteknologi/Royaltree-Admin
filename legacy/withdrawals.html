<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawals — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-cash-stack"></i> Withdrawals</div>
                        <button class="btn btn-outline" onclick="loadWithdrawals()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Amount</th>
                                    <th>Method</th>
                                    <th>Status</th>
                                    <th>Tanggal</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="wdBody">
                                <tr><td colspan="6" class="text-center text-muted" style="padding: 40px;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Withdrawals');

        async function loadWithdrawals() {
            const body = document.getElementById('wdBody');
            body.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding: 40px;">Loading...</td></tr>';
            try {
                const res = await AdminAPI.request('/withdrawals/all');
                const list = res.data || [];
                if (list.length === 0) {
                    body.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding: 40px;">Tidak ada withdrawal</td></tr>';
                    return;
                }
                body.innerHTML = list.map(w => {
                    const statusClass = w.status === 'PENDING' ? 'warning' : w.status === 'APPROVED' ? 'success' : w.status === 'REJECTED' ? 'danger' : 'muted';
                    return `
                        <tr>
                            <td><strong>${escapeHtml(w.userName || w.userId || '-')}</strong></td>
                            <td><strong class="text-gold">${w.currency === 'IDR' ? 'Rp ' + (w.amount || 0).toLocaleString('id-ID') : (w.amount || 0).toLocaleString('id-ID') + ' RTP'}</strong></td>
                            <td>${escapeHtml(w.providerName || w.channelType || w.method || '-')}</td>
                            <td><span class="badge badge-${statusClass}">${escapeHtml(w.status || '-')}</span></td>
                            <td class="text-secondary">${new Date(w.requestedAt || w.createdAt || Date.now()).toLocaleDateString('id-ID')}</td>
                            <td>
                                ${w.status === 'PENDING' ? `
                                    <button class="btn btn-sm btn-success" onclick="approveWd('${w.id}')"><i class="bi bi-check"></i></button>
                                    <button class="btn btn-sm btn-danger" onclick="rejectWd('${w.id}')"><i class="bi bi-x"></i></button>
                                ` : '-'}
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                body.innerHTML = `<tr><td colspan="6" class="text-center text-danger" style="padding: 40px;">${e.message}</td></tr>`;
            }
        }

        async function approveWd(id) {
            if (!confirm('Approve withdrawal ini?')) return;
            try {
                const res = await AdminAPI.request(`/withdrawals/${id}/approve`, { method: 'POST', body: {} });
                if (res.success) { showToast('Approved', 'success'); loadWithdrawals(); }
                else showToast(res.message || 'Gagal', 'error');
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function rejectWd(id) {
            const reason = prompt('Alasan reject:');
            if (!reason) return;
            try {
                const res = await AdminAPI.request(`/withdrawals/${id}/reject`, { method: 'POST', body: { reason } });
                if (res.success) { showToast('Rejected', 'success'); loadWithdrawals(); }
                else showToast(res.message || 'Gagal', 'error');
            } catch (e) { showToast(e.message, 'error'); }
        }

        loadWithdrawals();
    </script>
</body>
</html>
