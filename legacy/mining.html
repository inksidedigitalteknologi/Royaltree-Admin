<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-pickaxe"></i> Mining Pool</div></div>
                    <div id="miningContent"><div class="empty-state"><div class="empty-state-icon"><i class="bi bi-pickaxe"></i></div><div class="empty-state-title">Loading...</div></div></div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Mining');
        (async () => {
            try {
                const res = await AdminAPI.request("/mining/pool-fund");
                if (res.success && res.data) {
                    document.getElementById("miningContent").innerHTML = `
                        <div class="stat-grid">
                            <div class="stat-card"><div class="stat-icon green"><i class="bi bi-coin"></i></div><div class="stat-value">${(res.data.balance || 0).toLocaleString()}</div><div class="stat-label">Pool Fund (RTP)</div></div>
                        </div>`;
                }
            } catch (e) { document.getElementById("miningContent").innerHTML = `<div class="text-danger">${e.message}</div>`; }
        })();
    </script>
</body>
</html>
