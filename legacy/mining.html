<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <!-- Health Banner -->
                <div class="card mb-4" id="healthBanner">
                    <div class="card-body" style="display: flex; align-items: center; gap: 16px;">
                        <div class="stat-icon" id="healthIcon" style="margin: 0;">
                            <i class="bi bi-heart-pulse"></i>
                        </div>
                        <div style="flex: 1;">
                            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Pool Health</div>
                            <div style="font-size: 24px; font-weight: 900;" id="healthStatus">-</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 11px; color: var(--text-muted);">Last Update</div>
                            <div style="font-size: 13px; font-weight: 600;" id="lastUpdate">-</div>
                        </div>
                    </div>
                </div>

                <!-- Summary Cards -->
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-icon green"><i class="bi bi-coin"></i></div>
                        <div class="stat-value" id="statBalance">-</div>
                        <div class="stat-label">Pool Balance (RTP)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue"><i class="bi bi-arrow-down-circle"></i></div>
                        <div class="stat-value" id="statCollected">-</div>
                        <div class="stat-label">Total Collected (RTP)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon amber"><i class="bi bi-arrow-up-circle"></i></div>
                        <div class="stat-value" id="statPaidOut">-</div>
                        <div class="stat-label">Total Paid Out (RTP)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red"><i class="bi bi-graph-up"></i></div>
                        <div class="stat-value" id="statDevProfit">-</div>
                        <div class="stat-label">Dev Profit (RTP)</div>
                    </div>
                </div>

                <!-- Info Card -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-info-circle"></i> Pool Information</div>
                    </div>
                    <div class="d-grid gap-3" style="grid-template-columns: 1fr 1fr;">
                        <div>
                            <label class="form-label">Health</label>
                            <div id="infoHealth">-</div>
                        </div>
                        <div>
                            <label class="form-label">Balance</label>
                            <div id="infoBalance">-</div>
                        </div>
                        <div>
                            <label class="form-label">Total Collected</label>
                            <div id="infoCollected">-</div>
                        </div>
                        <div>
                            <label class="form-label">Total Paid Out</label>
                            <div id="infoPaidOut">-</div>
                        </div>
                        <div>
                            <label class="form-label">Dev Profit</label>
                            <div id="infoDevProfit">-</div>
                        </div>
                        <div>
                            <label class="form-label">Timestamp</label>
                            <div id="infoTimestamp">-</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Mining Pool');

        async function loadMining() {
            try {
                const res = await AdminAPI.request('/mining/pool-fund');
                if (!res.success || !res.data) {
                    document.getElementById('healthStatus').textContent = 'ERROR';
                    document.getElementById('healthStatus').style.color = 'var(--danger)';
                    return;
                }

                const d = res.data;

                // Health banner
                const health = d.health || 'UNKNOWN';
                const healthColor = health === 'HEALTHY' ? 'var(--success)' : health === 'WARNING' ? 'var(--warning)' : 'var(--danger)';
                const healthClass = health === 'HEALTHY' ? 'green' : health === 'WARNING' ? 'amber' : 'red';

                document.getElementById('healthStatus').textContent = health;
                document.getElementById('healthStatus').style.color = healthColor;
                document.getElementById('healthIcon').className = `stat-icon ${healthClass}`;
                document.getElementById('healthIcon').style.margin = '0';

                // Last update
                if (d.timestamp) {
                    const date = new Date(d.timestamp);
                    document.getElementById('lastUpdate').textContent = date.toLocaleString('id-ID');
                }

                // Stat cards
                document.getElementById('statBalance').textContent = (d.balance || 0).toLocaleString();
                document.getElementById('statCollected').textContent = (d.totalCollected || 0).toLocaleString();
                document.getElementById('statPaidOut').textContent = (d.totalPaidOut || 0).toLocaleString();
                document.getElementById('statDevProfit').textContent = (d.devProfit || 0).toLocaleString();

                // Info
                document.getElementById('infoHealth').textContent = health;
                document.getElementById('infoHealth').style.color = healthColor;
                document.getElementById('infoBalance').textContent = (d.balance || 0).toLocaleString() + ' RTP';
                document.getElementById('infoCollected').textContent = (d.totalCollected || 0).toLocaleString() + ' RTP';
                document.getElementById('infoPaidOut').textContent = (d.totalPaidOut || 0).toLocaleString() + ' RTP';
                document.getElementById('infoDevProfit').textContent = (d.devProfit || 0).toLocaleString() + ' RTP';
                if (d.timestamp) {
                    document.getElementById('infoTimestamp').textContent = new Date(d.timestamp).toLocaleString('id-ID');
                }

            } catch (e) {
                console.error('Mining error:', e);
                document.getElementById('healthStatus').textContent = 'ERROR';
                document.getElementById('healthStatus').style.color = 'var(--danger)';
                if (window.showToast) showToast('Error: ' + e.message, 'error');
            }
        }

        loadMining();
    </script>
</body>
</html>
