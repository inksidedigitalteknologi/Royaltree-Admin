<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-people"></i> Users</div>
                        <div class="d-flex gap-2">
                            <input type="text" class="form-input" id="searchInput" placeholder="Cari user..." style="width: 240px;">
                            <button class="btn btn-outline" onclick="loadUsers()"><i class="bi bi-arrow-clockwise"></i></button>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Tier</th>
                                    <th>Balance</th>
                                    <th>Referral</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="usersBody">
                                <tr><td colspan="6" class="text-center text-muted" style="padding: 40px;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Users');

        async function loadUsers() {
            const body = document.getElementById('usersBody');
            body.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding: 40px;">Loading...</td></tr>';
            try {
                const res = await AdminAPI.request('/users');
                if (!res.success || !res.data) {
                    body.innerHTML = '<tr><td colspan="6" class="text-center text-danger" style="padding: 40px;">Gagal load users</td></tr>';
                    return;
                }
                const search = (document.getElementById('searchInput').value || '').toLowerCase();
                const users = res.data.filter(u =>
                    !search || (u.name || '').toLowerCase().includes(search) || (u.email || '').toLowerCase().includes(search)
                );
                if (users.length === 0) {
                    body.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding: 40px;">Tidak ada user</td></tr>';
                    return;
                }
                body.innerHTML = users.map(u => `
                    <tr>
                        <td><strong>${escapeHtml(u.name || '-')}</strong></td>
                        <td class="text-secondary">${escapeHtml(u.email || '-')}</td>
                        <td><span class="badge badge-accent">${escapeHtml(u.tier || 'FREE')}</span></td>
                        <td>${(u.balance || 0).toLocaleString()} RTP</td>
                        <td>${u.referredCount || 0}</td>
                        <td>
                            <a href="user-detail.html?uid=${u.id}" class="btn btn-sm btn-outline"><i class="bi bi-eye"></i></a>
                            <button class="btn btn-sm btn-danger" onclick="banUser('${u.id}')"><i class="bi bi-slash-circle"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                body.innerHTML = `<tr><td colspan="6" class="text-center text-danger" style="padding: 40px;">${e.message}</td></tr>`;
            }
        }

        async function banUser(uid) {
            if (!confirm('Ban user ini?')) return;
            try {
                const res = await AdminAPI.request(`/users/${uid}/ban`, { method: 'POST', body: { reason: 'Admin ban' } });
                if (res.success) { showToast('User banned', 'success'); loadUsers(); }
                else showToast(res.message || 'Gagal', 'error');
            } catch (e) { showToast(e.message, 'error'); }
        }

        document.getElementById('searchInput').addEventListener('input', loadUsers);
        loadUsers();
    </script>
</body>
</html>
