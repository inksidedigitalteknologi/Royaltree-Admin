<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="tabs" id="configTabs">
                    <button class="tab active" data-tab="daily"><i class="bi bi-calendar-check"></i> Daily</button>
                    <button class="tab" data-tab="ads"><i class="bi bi-play-circle"></i> Ads</button>
                    <button class="tab" data-tab="game"><i class="bi bi-controller"></i> Game</button>
                    <button class="tab" data-tab="system"><i class="bi bi-shield-exclamation"></i> System</button>
                    <button class="tab" data-tab="shop"><i class="bi bi-shop"></i> Shop</button>
                    <button class="tab" data-tab="referral"><i class="bi bi-people"></i> Referral</button>
                    <button class="tab" data-tab="transfer"><i class="bi bi-send"></i> Transfer</button>
                    <button class="tab" data-tab="spin"><i class="bi bi-suit-spade"></i> Spin</button>
                </div>

                <div class="tab-content" id="dailyTab">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="bi bi-calendar-check"></i> Daily Reward</div></div>
                        <div class="form-group"><label class="form-label">Weekday Points</label><input type="number" class="form-input" id="daily_weekdayPoints"></div>
                        <div class="form-group"><label class="form-label">Weekend Points</label><input type="number" class="form-input" id="daily_weekendPoints"></div>
                        <button class="btn btn-success" onclick="saveConfig('daily')"><i class="bi bi-check-lg"></i> Simpan</button>
                    </div>
                </div>

                <div class="tab-content" id="adsTab" style="display:none;">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="bi bi-play-circle"></i> Ads Config</div></div>
                        <div class="form-group"><label class="form-label">Max Ads / Day</label><input type="number" class="form-input" id="ads_maxAdsPerDay"></div>
                        <div class="form-group"><label class="form-label">AdMob App ID</label><input type="text" class="form-input" id="ads_admob_appId"></div>
                        <div class="form-group"><label class="form-label">Rewarded Unit ID</label><input type="text" class="form-input" id="ads_admob_rewardedUnitId"></div>
                        <button class="btn btn-success" onclick="saveConfig('ads')"><i class="bi bi-check-lg"></i> Simpan</button>
                    </div>
                </div>

                <div class="tab-content" id="gameTab" style="display:none;">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="bi bi-controller"></i> Game Config</div></div>
                        <div class="form-group"><label class="form-label">USD → IDR</label><input type="number" class="form-input" id="game_usdToIdr"></div>
                        <div class="form-group"><label class="form-label">RTP → USD</label><input type="number" class="form-input" id="game_rtpToUsd"></div>
                        <button class="btn btn-success" onclick="saveConfig('game')"><i class="bi bi-check-lg"></i> Simpan</button>
                    </div>
                </div>

                <div class="tab-content" id="systemTab" style="display:none;">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="bi bi-shield-exclamation"></i> System</div></div>
                        <div class="form-group"><label class="form-label">Maintenance Message</label><input type="text" class="form-input" id="system_maintenanceMessage"></div>
                        <button class="btn btn-success" onclick="saveMaintenance()"><i class="bi bi-check-lg"></i> Simpan</button>
                    </div>
                </div>

                <div class="tab-content" id="shopTab" style="display:none;">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="bi bi-shop"></i> Shop Config</div></div>
                        <div id="shopConfigContent"><div class="empty-state"><div class="empty-state-icon"><i class="bi bi-shop"></i></div><div class="empty-state-title">Loading...</div></div></div>
                    </div>
                </div>

                <div class="tab-content" id="referralTab" style="display:none;">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="bi bi-people"></i> Referral</div></div>
                        <div id="referralContent" class="text-muted">Coming soon</div>
                    </div>
                </div>

                <div class="tab-content" id="transferTab" style="display:none;">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="bi bi-send"></i> Transfer</div></div>
                        <div id="transferContent" class="text-muted">Coming soon</div>
                    </div>
                </div>

                <div class="tab-content" id="spinTab" style="display:none;">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="bi bi-suit-spade"></i> Spin</div></div>
                        <div id="spinContent" class="text-muted">Coming soon</div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Config');

        document.querySelectorAll('#configTabs .tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#configTabs .tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const t = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
                const target = document.getElementById(t + 'Tab');
                if (target) target.style.display = '';
            });
        });

        window.loadConfig = async (type) => {
            try {
                const res = await AdminAPI.getConfig(type);
                if (!res.success) { showToast('Gagal load: ' + res.message, 'error'); return; }
                const d = res.data || {};
                if (type === 'daily') {
                    document.getElementById('daily_weekdayPoints').value = d.weekdayPoints || 50;
                    document.getElementById('daily_weekendPoints').value = d.weekendPoints || 100;
                } else if (type === 'ads') {
                    document.getElementById('ads_maxAdsPerDay').value = d.maxAdsPerDay || 20;
                    document.getElementById('ads_admob_appId').value = (d.admob && d.admob.appId) || '';
                    document.getElementById('ads_admob_rewardedUnitId').value = (d.admob && d.admob.rewardedUnitId) || '';
                } else if (type === 'game') {
                    document.getElementById('game_usdToIdr').value = d.usdToIdr || 16000;
                    document.getElementById('game_rtpToUsd').value = d.rtpToUsd || 0.01;
                } else if (type === 'shop') {
                    document.getElementById('shopConfigContent').innerHTML = '<pre style="color:var(--text-secondary);font-size:12px;overflow:auto;">' + JSON.stringify(d, null, 2) + '</pre>';
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        };

        window.saveConfig = async (type) => {
            let body = {};
            if (type === 'daily') {
                body = {
                    weekdayPoints: parseInt(document.getElementById('daily_weekdayPoints').value) || 0,
                    weekendPoints: parseInt(document.getElementById('daily_weekendPoints').value) || 0
                };
            } else if (type === 'ads') {
                body = {
                    maxAdsPerDay: parseInt(document.getElementById('ads_maxAdsPerDay').value) || 20,
                    admob: {
                        appId: document.getElementById('ads_admob_appId').value.trim(),
                        rewardedUnitId: document.getElementById('ads_admob_rewardedUnitId').value.trim()
                    }
                };
            } else if (type === 'game') {
                body = {
                    usdToIdr: parseFloat(document.getElementById('game_usdToIdr').value) || 0,
                    rtpToUsd: parseFloat(document.getElementById('game_rtpToUsd').value) || 0
                };
            }
            try {
                const res = await AdminAPI.saveConfig(type, body);
                if (res.success) showToast(type.toUpperCase() + ' config saved', 'success');
                else showToast('Gagal: ' + res.message, 'error');
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
        };

        // Load semua config saat init
        loadConfig('daily'); loadConfig('ads'); loadConfig('game');
        loadConfig('shop');
    </script>
</body>
</html>
