<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue"><i class="bi bi-people-fill"></i></div>
                        <div class="stat-value" id="statUsers">-</div>
                        <div class="stat-label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green"><i class="bi bi-coin"></i></div>
                        <div class="stat-value" id="statRtp">-</div>
                        <div class="stat-label">Total RTP</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon amber"><i class="bi bi-cash-stack"></i></div>
                        <div class="stat-value" id="statPending">-</div>
                        <div class="stat-label">Pending Withdrawals</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red"><i class="bi bi-pickaxe"></i></div>
                        <div class="stat-value" id="statMiners">-</div>
                        <div class="stat-label">Total Miners</div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-lightning-charge-fill"></i> Quick Actions</div>
                    </div>
                    <div class="d-flex gap-3 flex-wrap">
                        <a href="users.html" class="btn btn-primary"><i class="bi bi-people"></i> Manage Users</a>
                        <a href="withdrawals.html" class="btn btn-warning"><i class="bi bi-cash-stack"></i> Approve Withdrawals</a>
                        <a href="config.html" class="btn btn-outline"><i class="bi bi-gear"></i> Config</a>
                        <a href="broadcast.html" class="btn btn-outline"><i class="bi bi-send"></i> Broadcast</a>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-clock-history"></i> Recent Activity</div>
                        <a href="audit-logs.html" class="btn btn-sm btn-outline">View All</a>
                    </div>
                    <div id="recentActivity">
                        <div class="empty-state">
                            <div class="empty-state-icon"><i class="bi bi-inbox"></i></div>
                            <div class="empty-state-title">Loading activity...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        (async function() {
            AdminLayout.init('Dashboard');
            try {
                const res = await AdminAPI.getStats();
                if (res.success && res.data) {
                    const d = res.data;
                    document.getElementById('statUsers').textContent = (d.totalUsers || 0).toLocaleString();
                    document.getElementById('statRtp').textContent = (d.totalRTP || 0).toLocaleString();
                    document.getElementById('statPending').textContent = (d.pendingWithdrawals || 0).toLocaleString();
                    document.getElementById('statMiners').textContent = (d.totalMiners || 0).toLocaleString();
                }
            } catch (e) {
                console.error('Stats error:', e);
                if (window.showToast) showToast('Gagal load stats: ' + e.message, 'error');
            }
        })();
    </script>
</body>
</html>
