<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-trophy"></i> Achievements</div></div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead><tr><th>ID</th><th>Name</th><th>Reward</th><th>Condition</th></tr></thead>
                            <tbody id="achBody"><tr><td colspan="4" class="text-center text-muted" style="padding:40px;">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Achievements');
        (async () => {
            try {
                const res = await AdminAPI.request("/achievements");
                const list = res.data || [];
                const body = document.getElementById("achBody");
                if (list.length === 0) { body.innerHTML = "<tr><td colspan=\"4\" class=\"text-center text-muted\" style=\"padding:40px;\">No achievements</td></tr>"; return; }
                body.innerHTML = list.map(a => `<tr><td><code>${escapeHtml(a.id || "-")}</code></td><td>${escapeHtml(a.name || "-")}</td><td><strong class="text-gold">${a.reward || 0} RTP</strong></td><td class="text-secondary">${escapeHtml(a.condition || "-")}</td></tr>`).join("");
            } catch (e) { document.getElementById("achBody").innerHTML = `<tr><td colspan="4" class="text-center text-danger">${e.message}</td></tr>`; }
        })();
    </script>
</body>
</html>
