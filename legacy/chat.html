<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-chat-dots"></i> Global Chat</div></div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead><tr><th>User</th><th>Message</th><th>Waktu</th><th>Action</th></tr></thead>
                            <tbody id="chatBody"><tr><td colspan="4" class="text-center text-muted" style="padding:40px;">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Chat');
        (async () => {
            try {
                const res = await AdminAPI.request("/chat/messages");
                const list = res.messages || res.data || [];
                const body = document.getElementById("chatBody");
                if (list.length === 0) { body.innerHTML = "<tr><td colspan=\"4\" class=\"text-center text-muted\" style=\"padding:40px;\">No messages</td></tr>"; return; }
                body.innerHTML = list.map(m => `<tr><td>${escapeHtml(m.userName || m.userId || "-")}</td><td>${escapeHtml(m.message || "-")}</td><td class="text-secondary">${m.timestamp ? new Date(m.timestamp).toLocaleString("id-ID") : "-"}</td><td><button class="btn btn-sm btn-danger" onclick="delChat(\"${m.id}\")"><i class="bi bi-trash"></i></button></td></tr>`).join("");
            } catch (e) { document.getElementById("chatBody").innerHTML = `<tr><td colspan="4" class="text-center text-danger">${e.message}</td></tr>`; }
        })();
        async function delChat(id) {
            if (!confirm("Hapus pesan ini?")) return;
            try {
                await AdminAPI.request("/chat/" + id, { method: "DELETE" });
                showToast("Pesan dihapus", "success");
                location.reload();
            } catch (e) { showToast(e.message, "error"); }
        }
    </script>
</body>
</html>
