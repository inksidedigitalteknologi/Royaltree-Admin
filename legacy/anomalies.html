<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomalies — Royaltree Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin.css" rel="stylesheet">
    <script>(function(){if(!localStorage.getItem('royaltree_admin_token'))window.location.replace('login.html');})();</script>
</head>
<body>
    <div class="admin-layout">
        <aside id="admin-sidebar"></aside>
        <div class="admin-main">
            <header id="admin-topbar"></header>
            <main class="admin-content">
                <div class="card">
                    <div class="card-header"><div class="card-title"><i class="bi bi-shield-exclamation"></i> Anomalies (Anti-Fraud)</div></div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead><tr><th>User</th><th>Type</th><th>Severity</th><th>Status</th></tr></thead>
                            <tbody id="anomaliesBody"><tr><td colspan="4" class="text-center text-muted" style="padding:40px;">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        AdminLayout.init('Anomalies');
        (async () => {
            try {
                const res = await AdminAPI.request("/anomalies");
                const list = res.anomalies || res.data || [];
                const body = document.getElementById("anomaliesBody");
                if (list.length === 0) { body.innerHTML = "<tr><td colspan=\"4\" class=\"text-center text-muted\" style=\"padding:40px;\">No anomalies</td></tr>"; return; }
                body.innerHTML = list.map(a => {
                    const sevClass = a.severity === "CRITICAL" ? "danger" : a.severity === "HIGH" ? "warning" : "info";
                    return `<tr><td>${escapeHtml(a.userId || "-")}</td><td>${escapeHtml(a.type || "-")}</td><td><span class="badge badge-${sevClass}">${escapeHtml(a.severity || "-")}</span></td><td><span class="badge badge-${a.status === "OPEN" ? "danger" : "success"}">${escapeHtml(a.status || "-")}</span></td></tr>`;
                }).join("");
            } catch (e) { document.getElementById("anomaliesBody").innerHTML = `<tr><td colspan="4" class="text-center text-danger">${e.message}</td></tr>`; }
        })();
    </script>
</body>
</html>
